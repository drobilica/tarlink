# Canonical manifest v4 example. Values are intentionally reviewed Helm 4.2.4
# Linux releases; this file is documentation, not a second registry source.
schema: 4
id: helm
name: Helm
summary: Package manager for Kubernetes
homepage: https://helm.sh/
categories: [development, utilities]
platforms:
  linux-amd64:
    revision: 1
    release:
      default-channel: stable
      channels:
        stable:
          current: "4.2.4"
      releases:
        - channel: stable
          version: "4.2.4"
          url: https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          verification:
            algorithm: sha256
            digest: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
            source: https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum
          archive: tar.gz
    application:
      executables:
        - name: helm
          path: linux-amd64/helm
    desktop:
      enabled: false
      categories: []
  linux-arm64:
    revision: 1
    release:
      default-channel: stable
      channels:
        stable:
          current: "4.2.4"
      releases:
        - channel: stable
          version: "4.2.4"
          url: https://get.helm.sh/helm-v4.2.4-linux-arm64.tar.gz
          verification:
            algorithm: sha256
            digest: 564de2191b881e9f71b5606b25345821ea1682f06ab90499d3ab22b530176da1
            source: https://get.helm.sh/helm-v4.2.4-linux-arm64.tar.gz.sha256sum
          archive: tar.gz
    application:
      executables:
        - name: helm
          path: linux-arm64/helm
    desktop:
      enabled: false
      categories: []
