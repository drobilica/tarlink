# Canonical manifest v2 example. Values are intentionally the reviewed
# Blender 5.2.0 Linux amd64 release; this file is documentation, not a
# second registry source.
schema: 2
id: blender
name: Blender
summary: 3D creation suite
homepage: https://www.blender.org/
categories: [game-development, graphics]
platform:
  os: linux
  arch: amd64
release:
  default-channel: stable
  channels:
    stable:
      current: "5.2.0"
  releases:
    - channel: stable
      version: "5.2.0"
      url: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
      verification:
        algorithm: sha256
        digest: 96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48
        source: https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256
      archive: tar.xz
application:
  executables:
    - name: blender
      path: blender
desktop:
  enabled: true
  icon: blender.svg
  categories: [Graphics]
