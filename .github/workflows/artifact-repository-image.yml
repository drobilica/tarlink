name: Artifact repository image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: Independent artifact repository image version (for example v0.1.0)
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - build/artifact-repository/**
      - cmd/**
      - cli/**
      - internal/**
      - go.mod
      - go.sum
      - tui/**
      - .dockerignore
      - .github/workflows/artifact-repository-image.yml

permissions:
  contents: read

concurrency:
  group: artifact-repository-image-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop entry validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y desktop-file-utils

      - name: Run canonical validation
        run: ./scripts/validate.sh

  publish:
    needs: validate
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine immutable image reference
        run: echo "IMAGE=ghcr.io/drobilica/tarlink-artifact-repository:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Check version tag is new
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image version must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version_image="ghcr.io/drobilica/tarlink-artifact-repository:${IMAGE_VERSION}"
          if docker buildx imagetools inspect "$version_image" > /tmp/version-inspect.log 2>&1; then
            echo "Image version already exists: $version_image" >&2
            exit 1
          fi
          if ! grep -Eq 'manifest unknown|not found' /tmp/version-inspect.log; then
            cat /tmp/version-inspect.log >&2
            exit 1
          fi
          echo "VERSION_IMAGE=$version_image" >> "$GITHUB_ENV"

      - name: Build and publish artifact repository image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: build/artifact-repository/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.VERSION_IMAGE }}
          cache-from: type=gha,scope=artifact-repository-image
          cache-to: type=gha,mode=max,scope=artifact-repository-image
