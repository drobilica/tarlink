name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tarlink-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#v}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build native Linux binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-X github.com/drobilica/tarlink/internal/version.Current=$RELEASE_VERSION"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/tarlink-linux-${GOARCH}" ./cmd/tarlink
          test -f "dist/tarlink-linux-${GOARCH}"
          test -x "dist/tarlink-linux-${GOARCH}"
          description=$(file -b "dist/tarlink-linux-${GOARCH}")
          case "$description" in
            *'ELF 64-bit LSB'*) ;;
            *) echo "not a Linux ELF binary: $description" >&2; exit 1 ;;
          esac
          test_home="$RUNNER_TEMP/tarlink-build-home"
          mkdir -p "$test_home/config" "$test_home/data" "$test_home/state" "$test_home/cache"
          version_output=$(HOME="$test_home" XDG_CONFIG_HOME="$test_home/config" XDG_DATA_HOME="$test_home/data" XDG_STATE_HOME="$test_home/state" XDG_CACHE_HOME="$test_home/cache" "dist/tarlink-linux-${GOARCH}" version)
          test "$version_output" = "tarlink $RELEASE_VERSION"

      - name: Upload binary for assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarlink-linux-${{ matrix.arch }}
          path: dist/tarlink-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate stable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Run source checks
        env:
          HOME: ${{ runner.temp }}/tarlink-source-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-source-home/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-source-home/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-source-home/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-source-home/cache
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          go test ./internal/architecture
          CGO_ENABLED=0 go build ./...
          ./tests/install_test.sh
          ./tests/uninstall_test.sh

  assemble:
    name: Assemble exact assets
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download built binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tarlink-linux-*
          path: dist
          merge-multiple: true

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 dist/tarlink-linux-amd64 dist/tarlink-linux-arm64

      - name: Create and validate exact assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          (cd dist && sha256sum tarlink-linux-amd64 tarlink-linux-arm64 > checksums.txt)
          ./tests/release_artifacts_test.sh dist "$RELEASE_VERSION" amd64

      - name: Upload assembled release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/tarlink-linux-amd64
            dist/tarlink-linux-arm64
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  registry-snapshot:
    name: Snapshot official registry
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Check out official registry main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink-registry
          ref: main
          path: registry
          fetch-depth: 1

      - name: Record exact registry commit
        id: snapshot
        shell: bash
        run: echo "sha=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.arch }} assets
    needs: [assemble, registry-snapshot]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download exact assembled assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 dist/tarlink-linux-amd64 dist/tarlink-linux-arm64

      - name: Check out official registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink-registry
          ref: ${{ needs.registry-snapshot.outputs.sha }}
          path: registry
          fetch-depth: 1

      - name: Validate exact assets, registry, installer, and uninstaller
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/cache
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          ./tests/release_artifacts_test.sh dist "$RELEASE_VERSION" "${{ matrix.arch }}"
          "dist/tarlink-linux-${{ matrix.arch }}" registry validate "$PWD/registry"
          TARLINK_TEST_ASSET_DIR="$PWD/dist" TARLINK_TEST_RELEASE_VERSION="$RELEASE_VERSION" TARLINK_TEST_ARCH="${{ matrix.arch }}" FAKE_UNAME_M="${{ matrix.machine }}" ./tests/install_test.sh

  draft:
    name: Upload draft release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 dist/tarlink-linux-amd64 dist/tarlink-linux-arm64

      - name: Create draft and upload exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          verify_triggering_tag() {
            tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk -v tag="refs/tags/$RELEASE_TAG" '
              $2 == tag "^{}" { print $1; found=1; exit }
              $2 == tag { direct=$1 }
              END { if (!found && direct != "") print direct }
            ')
            test -n "$tag_sha" && test "$tag_sha" = "$EXPECTED_SHA" || {
              echo "remote tag $RELEASE_TAG does not resolve to $EXPECTED_SHA" >&2
              exit 1
            }
          }
          release_state_file="$RUNNER_TEMP/tarlink-release-state"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft >"$release_state_file"; then
            test "$(cat "$release_state_file")" = true || {
              echo "refusing to replace a public release: $RELEASE_TAG" >&2
              exit 1
            }
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo "refusing to delete a release that is no longer a draft: $RELEASE_TAG" >&2
              exit 1
            }
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          verify_triggering_tag
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "TarLink $RELEASE_TAG" --notes "TarLink $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/tarlink-linux-amd64 dist/tarlink-linux-arm64 dist/checksums.txt
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          expected=$(printf '%s\n' checksums.txt tarlink-linux-amd64 tarlink-linux-arm64 | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual" = "$expected"

  remote-verify:
    name: Verify draft remotely on ${{ matrix.arch }}
    needs: [draft, registry-snapshot]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check out official registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink-registry
          ref: ${{ needs.registry-snapshot.outputs.sha }}
          path: registry
          fetch-depth: 1

      - name: Download immutable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Restore executable modes for release assets
        shell: bash
        run: chmod 0755 release-assets/tarlink-linux-amd64 release-assets/tarlink-linux-arm64

      - name: Download exact draft assets from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p remote
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir remote --pattern tarlink-linux-amd64 --pattern tarlink-linux-arm64 --pattern checksums.txt

      - name: Restore executable modes for downloaded draft
        shell: bash
        run: chmod 0755 remote/tarlink-linux-amd64 remote/tarlink-linux-arm64

      - name: Verify remote assets, registry, installer, and uninstaller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/tarlink-remote-home-${{ matrix.arch }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-remote-home-${{ matrix.arch }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-remote-home-${{ matrix.arch }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-remote-home-${{ matrix.arch }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-remote-home-${{ matrix.arch }}/cache
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          for name in checksums.txt tarlink-linux-amd64 tarlink-linux-arm64; do
            cmp -- "release-assets/$name" "remote/$name" || {
              echo "remote draft asset differs from release-assets artifact: $name" >&2
              exit 1
            }
          done
          ./tests/release_artifacts_test.sh remote "$RELEASE_VERSION" "${{ matrix.arch }}"
          "remote/tarlink-linux-${{ matrix.arch }}" registry validate "$PWD/registry"
          TARLINK_TEST_ASSET_DIR="$PWD/remote" TARLINK_TEST_RELEASE_VERSION="$RELEASE_VERSION" TARLINK_TEST_ARCH="${{ matrix.arch }}" FAKE_UNAME_M="${{ matrix.machine }}" ./tests/install_test.sh

  publish:
    name: Publish verified release
    needs: remote-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download immutable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Restore executable modes for release assets
        shell: bash
        run: chmod 0755 release-assets/tarlink-linux-amd64 release-assets/tarlink-linux-arm64

      - name: Download exact draft assets from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p remote
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir remote --pattern tarlink-linux-amd64 --pattern tarlink-linux-arm64 --pattern checksums.txt

      - name: Restore executable modes for downloaded draft
        shell: bash
        run: chmod 0755 remote/tarlink-linux-amd64 remote/tarlink-linux-arm64

      - name: Publish draft as latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          expected=$(printf '%s\n' checksums.txt tarlink-linux-amd64 tarlink-linux-arm64 | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual" = "$expected"
          for name in checksums.txt tarlink-linux-amd64 tarlink-linux-arm64; do
            cmp -- "release-assets/$name" "remote/$name" || {
              echo "remote draft asset differs from release-assets artifact: $name" >&2
              exit 1
            }
          done
          tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk -v tag="refs/tags/$RELEASE_TAG" '
            $2 == tag "^{}" { print $1; found=1; exit }
            $2 == tag { direct=$1 }
            END { if (!found && direct != "") print direct }
          ')
          test -n "$tag_sha" && test "$tag_sha" = "$EXPECTED_SHA" || {
            echo "remote tag $RELEASE_TAG does not resolve to $EXPECTED_SHA" >&2
            exit 1
          }
          if ! latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json isLatest,tagName --limit 1000 --jq '
            if length == 0 then ""
            elif ([.[] | select(.isLatest == true)] | length) == 1 then
              ([.[] | select(.isLatest == true) | .tagName][0])
            else
              error("expected exactly one GitHub Latest release")
            end
          '); then
            echo "could not determine the existing GitHub Latest release" >&2
            exit 1
          fi
          if [ -n "$latest_tag" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "candidate release tag is not a stable semantic version: $RELEASE_TAG" >&2
              exit 1
            fi
            candidate_major=${BASH_REMATCH[1]}
            candidate_minor=${BASH_REMATCH[2]}
            candidate_patch=${BASH_REMATCH[3]}
            if [[ ! "$latest_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "existing GitHub Latest release has an unexpected tag: $latest_tag" >&2
              exit 1
            fi
            latest_major=${BASH_REMATCH[1]}
            latest_minor=${BASH_REMATCH[2]}
            latest_patch=${BASH_REMATCH[3]}
            if (( candidate_major < latest_major ||
                  (candidate_major == latest_major && candidate_minor < latest_minor) ||
                  (candidate_major == latest_major && candidate_minor == latest_minor && candidate_patch < latest_patch) )); then
              echo "candidate release $RELEASE_TAG is older than the current GitHub Latest release $latest_tag" >&2
              exit 1
            fi
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
