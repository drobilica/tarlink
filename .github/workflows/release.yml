name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: tarlink-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source ./.github/scripts/release-verify.sh
          release_is_stable_tag "$RELEASE_TAG" || {
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }
          RELEASE_VERSION=${RELEASE_TAG#v}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Build native Linux binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-X github.com/drobilica/tarlink/internal/version.Current=$RELEASE_VERSION"
          mkdir -p dist
          go build -trimpath -ldflags "$LDFLAGS" -o "dist/tarlink-linux-${GOARCH}" ./cmd/tarlink
          test -f "dist/tarlink-linux-${GOARCH}"
          test -x "dist/tarlink-linux-${GOARCH}"
          description=$(file -b "dist/tarlink-linux-${GOARCH}")
          case "$description" in
            *'ELF 64-bit LSB'*) ;;
            *) echo "not a Linux ELF binary: $description" >&2; exit 1 ;;
          esac
          test_home="$RUNNER_TEMP/tarlink-build-home"
          mkdir -p "$test_home/config" "$test_home/data" "$test_home/state" "$test_home/cache"
          version_output=$(HOME="$test_home" XDG_CONFIG_HOME="$test_home/config" XDG_DATA_HOME="$test_home/data" XDG_STATE_HOME="$test_home/state" XDG_CACHE_HOME="$test_home/cache" "dist/tarlink-linux-${GOARCH}" version)
          test "$version_output" = "tarlink $RELEASE_VERSION"

      - name: Upload binary for assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarlink-linux-${{ matrix.arch }}
          path: dist/tarlink-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop entry validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y desktop-file-utils

      - name: Validate stable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source ./.github/scripts/release-verify.sh
          release_is_stable_tag "$RELEASE_TAG" || {
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Run canonical validation
        env:
          HOME: ${{ runner.temp }}/tarlink-source-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-source-home/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-source-home/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-source-home/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-source-home/cache
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          ./scripts/validate.sh

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate stable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source ./.github/scripts/release-verify.sh
          release_is_stable_tag "$RELEASE_TAG" || {
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Generate structured release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-notes
          bash ./.github/scripts/generate-release-notes.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$EXPECTED_SHA" release-notes/notes.md

      - name: Upload structured release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes/notes.md
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble exact assets
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tarlink-linux-*
          path: dist
          merge-multiple: true

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 dist/tarlink-linux-amd64 dist/tarlink-linux-arm64

      - name: Generate exact checksums.txt
        shell: bash
        run: |
          (cd dist && sha256sum tarlink-linux-amd64 tarlink-linux-arm64 > checksums.txt)

      - name: Validate assembled release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          ./tests/release_artifacts_test.sh dist "$RELEASE_VERSION" amd64

      - name: Upload assembled release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/tarlink-linux-amd64
            dist/tarlink-linux-arm64
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  registry-snapshot:
    name: Snapshot official registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Resolve official registry main once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink-registry
          ref: main
          path: registry
          fetch-depth: 1

      - name: Record exact registry commit
        id: snapshot
        shell: bash
        run: |
          actual_sha=$(git -C registry rev-parse HEAD)
          if [[ ! "$actual_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved registry commit is not a full lowercase SHA" >&2
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

  stage:
    name: Stage draft release
    needs: [assemble, release-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download structured release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes

      - name: Download exact assembled assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 dist/tarlink-linux-amd64 dist/tarlink-linux-arm64

      - name: Validate stable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source ./.github/scripts/release-verify.sh
          release_is_stable_tag "$RELEASE_TAG" || {
            echo "release tag must be stable vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Verify remote tag resolves to triggering commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          source ./.github/scripts/release-verify.sh
          lsremote_file="$RUNNER_TEMP/tarlink-tag-lsremote.txt"
          git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" >"$lsremote_file"
          tag_sha=$(release_parse_tag_sha "$lsremote_file" "$RELEASE_TAG")
          test -n "$tag_sha" && test "$tag_sha" = "$EXPECTED_SHA" || {
            echo "remote tag $RELEASE_TAG does not resolve to $EXPECTED_SHA" >&2
            exit 1
          }

      # This is the single writer of the draft release. It never deletes,
      # recreates, overwrites, or clobbers: an absent draft is created and its
      # assets uploaded exactly once, while an existing draft is reused only
      # when its tag, asset set, digests, and bytes exactly match the assembled
      # artifacts. It executes no TarLink release binary or validation tests.
      - name: Stage draft release if absent, else verify exact reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source ./.github/scripts/release-verify.sh
          release_pages="$RUNNER_TEMP/tarlink-release-pages.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$release_pages"
          draft_count=$(release_count_matching_drafts "$release_pages" "$RELEASE_TAG")
          total_count=$(release_count_matching_any "$release_pages" "$RELEASE_TAG")
          draft_action=$(release_draft_action "$draft_count" "$total_count") || exit 1
          download_remote_assets() {
            release_json=$1
            release_assert_exact_asset_names "$release_json"
            mkdir -p remote
            while IFS=$'\t' read -r name asset_url; do
              case "$name" in
                checksums.txt|tarlink-linux-amd64|tarlink-linux-arm64) ;;
                *) echo "unexpected draft asset: $name" >&2; exit 1 ;;
              esac
              test -n "$asset_url"
              gh api --header 'Accept: application/octet-stream' "$asset_url" >"remote/$name"
            done < <(jq -r '.assets[] | [.name, .url] | @tsv' "$release_json")
            release_compare_asset_bytes dist remote
            release_verify_checksums remote
          }
          if [[ $draft_action == create ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "TarLink $RELEASE_TAG" --notes-file release-notes/notes.md
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/tarlink-linux-amd64 dist/tarlink-linux-arm64 dist/checksums.txt
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$RUNNER_TEMP/tarlink-staged-pages.json"
            staged_count=$(release_count_matching_drafts "$RUNNER_TEMP/tarlink-staged-pages.json" "$RELEASE_TAG")
            staged_total=$(release_count_matching_any "$RUNNER_TEMP/tarlink-staged-pages.json" "$RELEASE_TAG")
            staged_action=$(release_draft_action "$staged_count" "$staged_total") || exit 1
            test "$staged_action" = reuse || exit 1
            release_id=$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.draft == true and .tag_name == $tag)][0].id' "$RUNNER_TEMP/tarlink-staged-pages.json")
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$RUNNER_TEMP/tarlink-staged-release.json"
            release_require_draft_tag "$RUNNER_TEMP/tarlink-staged-release.json" "$RELEASE_TAG"
            download_remote_assets "$RUNNER_TEMP/tarlink-staged-release.json"
          elif [[ $draft_action == reuse ]]; then
            release_id=$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.draft == true and .tag_name == $tag)][0].id' "$release_pages")
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$RUNNER_TEMP/tarlink-staged-release.json"
            release_require_draft_tag "$RUNNER_TEMP/tarlink-staged-release.json" "$RELEASE_TAG"
            download_remote_assets "$RUNNER_TEMP/tarlink-staged-release.json"
          else
            echo "expected at most one draft release for tag $RELEASE_TAG, found $draft_count" >&2
            exit 1
          fi

      - name: Upload verified bridge assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bridge
          path: remote
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate ${{ matrix.arch }} assets
    needs: [stage, registry-snapshot]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Read-only validation consumes only the bridge artifact written by the
      # stage job. It never queries the GitHub release API: the bridge bytes
      # are already the download-verified draft contents.
      - name: Download verified bridge assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bridge
          path: remote

      - name: Restore executable modes
        shell: bash
        run: chmod 0755 remote/tarlink-linux-amd64 remote/tarlink-linux-arm64

      - name: Check out official registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: drobilica/tarlink-registry
          ref: ${{ needs.registry-snapshot.outputs.sha }}
          path: registry
          fetch-depth: 1

      - name: Validate exact bridge assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/cache
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          ./tests/release_artifacts_test.sh remote "$RELEASE_VERSION" "${{ matrix.arch }}"

      - name: Validate official registry snapshot
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/cache
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          "remote/tarlink-linux-${{ matrix.arch }}" registry validate "$PWD/registry"

      - name: Run installer and uninstaller tests against bridge assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/tarlink-asset-home-${{ matrix.arch }}/cache
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          TARLINK_TEST_ASSET_DIR="$PWD/remote" TARLINK_TEST_RELEASE_VERSION="$RELEASE_VERSION" TARLINK_TEST_ARCH="${{ matrix.arch }}" FAKE_UNAME_M="${{ matrix.machine }}" ./tests/install_test.sh

  publish:
    name: Publish verified release
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified bridge assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bridge
          path: expected-assets

      # Publication rechecks the authoritative tag, the single expected draft
      # state, and the exact remote asset names, digests, and bytes against the
      # bridge artifact. It executes no released code and overwrites nothing.
      - name: Final publication gate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          source ./.github/scripts/release-verify.sh
          lsremote_file="$RUNNER_TEMP/tarlink-tag-lsremote.txt"
          git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" >"$lsremote_file"
          tag_sha=$(release_parse_tag_sha "$lsremote_file" "$RELEASE_TAG")
          test -n "$tag_sha" && test "$tag_sha" = "$EXPECTED_SHA" || {
            echo "remote tag $RELEASE_TAG does not resolve to $EXPECTED_SHA" >&2
            exit 1
          }
          release_pages="$RUNNER_TEMP/tarlink-release-pages.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$release_pages"
          draft_count=$(release_count_matching_drafts "$release_pages" "$RELEASE_TAG")
          total_count=$(release_count_matching_any "$release_pages" "$RELEASE_TAG")
          draft_action=$(release_draft_action "$draft_count" "$total_count") || exit 1
          test "$draft_action" = reuse || exit 1
          release_id=$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.draft == true and .tag_name == $tag)][0].id' "$release_pages")
          release_json="$RUNNER_TEMP/tarlink-draft-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >"$release_json"
          release_require_draft_tag "$release_json" "$RELEASE_TAG"
          release_assert_exact_asset_names "$release_json"
          mkdir -p remote
          while IFS=$'\t' read -r name asset_url; do
            case "$name" in
              checksums.txt|tarlink-linux-amd64|tarlink-linux-arm64) ;;
              *) echo "unexpected draft asset: $name" >&2; exit 1 ;;
            esac
            test -n "$asset_url"
            gh api --header 'Accept: application/octet-stream' "$asset_url" >"remote/$name"
          done < <(jq -r '.assets[] | [.name, .url] | @tsv' "$release_json")
          release_compare_asset_bytes expected-assets remote
          release_verify_checksums remote
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json isLatest,tagName --limit 1000 --jq '
            if length == 0 then ""
            elif ([.[] | select(.isLatest == true)] | length) == 1 then
              ([.[] | select(.isLatest == true) | .tagName][0])
            else
              error("expected exactly one GitHub Latest release")
            end
          ') || {
            echo "could not determine the existing GitHub Latest release" >&2
            exit 1
          }
          release_candidate_not_older_than_latest "$RELEASE_TAG" "$latest_tag"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
