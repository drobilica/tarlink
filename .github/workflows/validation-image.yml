name: Validation image

on:
  push:
    branches:
      - main
    paths:
      - build/validation/Containerfile
      - go.mod
      - go.sum
      - .github/workflows/validation-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: validation-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Determine deterministic image tag
        shell: bash
        run: |
          go_version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          fingerprint=$(sha256sum build/validation/Containerfile go.mod go.sum | sha256sum | cut -c1-16)
          echo "IMAGE=ghcr.io/drobilica/tarlink-validation:go${go_version}-${fingerprint}" >> "$GITHUB_ENV"

      - name: Build and publish validation image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: build/validation/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=validation-image
          cache-to: type=gha,mode=max,scope=validation-image
