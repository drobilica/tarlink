name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop entry validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y desktop-file-utils

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Installer test
        run: ./tests/install_test.sh

      - name: Uninstaller test
        run: ./tests/uninstall_test.sh

      - name: Race test
        run: go test -race ./...

      - name: Check forbidden imports
        run: go test ./internal/architecture

      - name: Build without CGO
        env:
          CGO_ENABLED: 0
        run: go build ./cmd/tarlink
