# Project-local Codex defaults. Custom role layers are kept in .codex/agents/.

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.specialist]
description = "Specialist for difficult architecture, security, lifecycle, and debugging work."
config_file = "agents/specialist.toml"
