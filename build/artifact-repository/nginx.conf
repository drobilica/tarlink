worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    autoindex off;

    server {
        listen 8080;
        root /repository;
        disable_symlinks on;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /repository.json {
            try_files $uri =404;
            limit_except GET HEAD {
                deny all;
            }
        }

        location ~ "^/v1/sha256/[0-9a-f]{64}$" {
            try_files $uri =404;
            limit_except GET HEAD {
                deny all;
            }
        }

        location ~ "^/v1/sha512/[0-9a-f]{128}$" {
            try_files $uri =404;
            limit_except GET HEAD {
                deny all;
            }
        }

        location / {
            return 404;
        }
    }
}
