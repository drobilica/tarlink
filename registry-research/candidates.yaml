  - id: black-xbe-recomp
    upstream: TGP482/Black-XBERecomp
    last_checked: {release_tag: V3, release_id: 427929954}
    status: blocked
    blockers: [WINDOWS_ONLY]
    reconsider_when: [new-upstream-release]
    evidence_links:
      - {label: release, url: https://github.com/TGP482/Black-XBERecomp/releases/tag/V3}
      - {label: requirements, url: https://github.com/TGP482/Black-XBERecomp}
      - {label: alternative-starter, url: https://github.com/portingpete/Black-2006-Recomp/releases/tag/v0.1.0-alpha.5}
    notes: >-
      BLACK's V3 release publishes BLACK-XBERecomp.zip; upstream documents a Windows
      10 x64 executable using Direct3D 12 and first-start game-code compilation.
      No native Linux game artifact is published. The separate portingpete alpha.5
      starter (release 420734529) includes a native Linux launcher but requires
      build tools, setup and Wine/Proton for the Windows game; it is not a portable
      native Linux game package. Reconsider when a suitable Linux release exists.
  - id: the-darkness-recomp
    upstream: portingpete/The-Darkness-Recomp
    last_checked: {release_tag: v0.1.8, release_id: 425537596}
    status: blocked
    blockers: [WINDOWS_ONLY, SETUP_SCRIPT_REQUIRED, SYSTEM_INTEGRATION_REQUIRED]
    reconsider_when: [new-upstream-release]
    evidence_links:
      - {label: release, url: https://github.com/portingpete/The-Darkness-Recomp/releases/tag/v0.1.8}
      - {label: linux-setup, url: https://github.com/portingpete/The-Darkness-Recomp/blob/v0.1.8/STEAM_DECK.md}
    notes: >-
      The Steam Deck AppImage is an installer for the Windows game, not a native
      Linux game payload. Release instructions require Python 3.10+, KDialog or
      Zenity, a user-selected installation parent, UMU/GE-Proton acquisition and
      desktop-launcher creation; first play may download Steam Runtime. This does
      not fit TarLink's existing portable application/runtime contract. An AppImage
      filename and upstream checksums alone do not make this installer admissible.
  - id: alien-resurrection
    upstream: DiegoDeDios/AlienReRecomp
    last_checked: {release_tag: v0.1.8, release_id: 423102286}
    status: ready
    reconsider_when: [new-upstream-release]
    evidence_links:
      - {label: release, url: https://github.com/DiegoDeDios/AlienReRecomp/releases/tag/v0.1.8}
      - {label: linux-amd64, url: https://github.com/DiegoDeDios/AlienReRecomp/releases/download/v0.1.8/AlienResurrection-0.1.8-linux-x86_64.tar.gz}
    notes: >-
      Recommended for manifest review on linux-amd64. Bounded TarLink inspection
      safely extracted the exact archive and computed SHA-256
      12c5790d50dee8a64ed03b5f7780f14e4a75612773b6dbc5b252d0f0545b007d,
      matching GitHub's asset digest. AlienResurrection is an amd64 ELF with
      $ORIGIN/lib RUNPATH; libSDL3.so.0 is bundled and the only unresolved SONAMEs
      are ld-linux-x86-64.so.2, libc.so.6 and libm.so.6. Upstream requires glibc
      2.35+ and a Vulkan driver; no Linux arm64 asset is published. The release
      describes an interpreter reading the user's own USA disc image, rather
      than distributing recompiled game code. Original game data remains external.
      Ready means packaging candidate only: desktop icon selection, a reviewed
      manifest and registry validate/check are still required. No gameplay tested.
