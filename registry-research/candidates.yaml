      - {label: linux-appimage, url: https://github.com/spacepepperoni/uncharted_Linux/releases/download/v0.3.11-linux.157/Uncharted-x86_64.AppImage}
      - {label: requirements, url: https://github.com/spacepepperoni/uncharted_Linux}
      - {label: alternative-linux-fork, url: https://github.com/Pepin208/uncharted_pc_linux/releases/tag/v0.3.9-linux}
    notes: >-
      Native Linux candidate for all three games in The Nathan Drake Collection,
      not three separate packages. TarLink downloaded the opaque AppImage and
      computed SHA-256 2c12b34bf5cd7acc9e4301547b9cd30e2c8d1cae687a5f7a4070ce001703c25c,
      matching GitHub's asset digest. The same release's tar.gz also matched its
      published digest, but bounded extraction rejected it with
      UNSAFE_ARTIFACT_LAYOUT. Advisory AppImage inspection reports PLATFORM
      ambiguity for this filename; platform admission is not yet established.
      Upstream documents x86_64, glibc 2.41+, Vulkan 1.3 and at least 6 GB VRAM,
      but also lists Ubuntu 24.04 among tested distributions; reconcile that
      baseline before admission. Review writable saves/cache paths and desktop
      icon selection, then validate a manifest and materialize the artifact.
      The Pepin208 v0.3.9-linux fork (release 426323981) claims glibc 2.39+;
      its AppImage was also downloaded and inspected, with matching SHA-256
      3274c11c13bf094a8e964ca3fd2d15f79ff78f9cd137612de67b8e27bcc770c6.
      Advisory inspection likewise reports PLATFORM ambiguity. Neither artifact
      was executed, mounted or extracted. Original decrypted collection data
      remains user-provided. No gameplay tested.
